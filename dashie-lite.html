<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=/dashie-kiosk">
  <title>Redirecting to Dashie Kiosk...</title>
  <link rel="icon" type="image/png" href="./artwork/Dashie_Kiosk_Logo.png">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f8f9fa;
      color: #424242;
    }
    .redirect-message {
      text-align: center;
      padding: 40px;
    }
    .redirect-message h1 {
      font-size: 2em;
      margin-bottom: 20px;
      color: #ffaa00;
    }
    .redirect-message p {
      font-size: 1.1em;
      margin-bottom: 20px;
    }
    .redirect-message a {
      color: #ffaa00;
      text-decoration: none;
      font-weight: 600;
    }
    .redirect-message a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="redirect-message">
    <h1>Dashie Lite is now Dashie Kiosk!</h1>
    <p>You're being redirected to the new page...</p>
    <p>If you're not redirected automatically, <a href="/dashie-kiosk">click here</a>.</p>
  </div>

  <script>
    // Fallback redirect in case meta refresh doesn't work
    setTimeout(function() {
      window.location.href = '/dashie-kiosk';
    }, 100);
  </script>
</body>
</html>
